- name: Generate debug keystore
  run: |
    mkdir -p ~/.android

    keytool -genkeypair \
      -keystore ~/.android/debug.keystore \
      -alias androiddebugkey \
      -keyalg RSA \
      -keysize 2048 \
      -validity 10000 \
      -storepass android \
      -keypass android \
      -dname "CN=Android Debug,O=Android,C=US" \
      -noprompt

    echo "===== SHA-1 ====="

    keytool -list -v \
      -keystore ~/.android/debug.keystore \
      -alias androiddebugkey \
      -storepass android | grep "SHA1:"
